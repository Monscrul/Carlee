<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlee: Car Guessing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loading" class="loading" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Loading cars…</p>
    </div>

    <div id="error" class="error hidden" role="alert" aria-live="assertive">
      <p>Failed to load the car catalog. Please refresh the page.</p>
    </div>

    <button class="hamburger" id="menuToggle" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <aside class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sidebar-panel">
        <button class="sidebar-close" id="menuClose" aria-label="Close navigation menu">×</button>
        <div class="sidebar-brand">
          <span class="sidebar-logo">Carlee</span>
          <p class="sidebar-tag">Car guessing game</p>
        </div>
        <nav class="sidebar-nav" aria-label="Primary">
          <a class="sidebar-link active" href="home.html">Home</a>
          <a class="sidebar-link" href="/index.html">Play Game</a>
          <a class="sidebar-link" href="#how-to-play">How To Play</a>
          <a class="sidebar-link" href="#statistics">Statistics</a>
          <a class="sidebar-link" href="#about">About</a>
        </nav>
      </div>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    </aside>

    <main id="app" class="app hidden">
      <header class="header">
        <div class="header-text">
          <h1>Carlee.com</h1>
          <p class="subtitle">Guess the car in 6 tries</p>
        </div>
        <p id="guess-counter" class="guess-counter" aria-live="polite">Guesses: 0 / 6</p>
      </header>

      <section class="search-section" aria-label="Guess a car">
        <div class="search-wrapper">
          <input
            id="search-input"
            type="text"
            class="search-input"
            placeholder="Search make or model…"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="search-dropdown"
            aria-expanded="false"
            disabled
          />
          <ul id="search-dropdown" class="search-dropdown hidden" role="listbox"></ul>
        </div>
        <button id="guess-btn" class="guess-btn" type="button" disabled>Guess</button>
      </section>

      <p id="search-error" class="search-error hidden" role="alert"></p>

      <section class="board-section" aria-label="Guess history">
        <p id="empty-hint" class="empty-hint">Make your first guess to see comparisons.</p>
        <div id="guess-cards" class="guess-cards" aria-live="polite"></div>
      </section>

      <section
        id="game-over"
        class="game-over hidden"
        aria-live="polite"
        aria-label="Game over"
      >
        <div class="game-over-wrapped">
          <button id="close-game-over-btn" class="game-over-close" type="button" aria-label="Close game over screen">×</button>
          <p id="game-over-message" class="game-over-message"></p>
          <div id="secret-reveal" class="secret-reveal"></div>
          <button id="play-again-btn" class="play-again-btn" type="button">Play again</button>
        </div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
    <script>
      const menuToggle = document.getElementById('menuToggle');
      const menuClose = document.getElementById('menuClose');
      const sidebar = document.getElementById('sidebar');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');

      function openSidebar() {
        document.body.classList.add('sidebar-open');
        sidebar.setAttribute('aria-hidden', 'false');
        menuToggle.setAttribute('aria-expanded', 'true');
      }

      function closeSidebar() {
        document.body.classList.remove('sidebar-open');
        sidebar.setAttribute('aria-hidden', 'true');
        menuToggle.setAttribute('aria-expanded', 'false');
      }

      menuToggle.addEventListener('click', () => {
        if (document.body.classList.contains('sidebar-open')) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      menuClose.addEventListener('click', closeSidebar);
      sidebarBackdrop.addEventListener('click', closeSidebar);
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
          closeSidebar();
        }
      });
    </script>
  </body>
</html>
